name: build

# Every platform ntls claims to run on is built here, on every push — which is
# the only way that claim stays true. A tag builds the same things and hangs
# them off a release.
on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # A release build of a GPU application is large; the cache is worth more
  # than the debug information in CI.
  CARGO_PROFILE_RELEASE_DEBUG: "false"

jobs:
  # The tests are hermetic and platform-independent, so they run once rather
  # than six times.
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install the libraries GPUI links against
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libfontconfig-dev libwayland-dev libx11-xcb-dev \
            libxcb1-dev libxcb-dri3-dev libxkbcommon-x11-dev libssl-dev \
            libzstd-dev libvulkan-dev libgit2-dev make cmake clang mold
      # Hermetic: target and port parsing, the certificate transparency
      # aggregation, the vendor database, the tool contract, the workflow
      # reader and writer, and a real port scan and ping against loopback.
      - run: cargo test

  macos:
    name: macOS (universal)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin, aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2

      - name: Make sure the Metal toolchain is there
        run: |
          # GPUI compiles its shaders at build time. The runners normally have
          # this already; asking for it twice costs nothing.
          xcodebuild -downloadComponent MetalToolchain 2>/dev/null || \
            echo "the Metal toolchain is already installed, or cannot be fetched here"

      - name: Build both architectures
        run: |
          cargo build --release --target x86_64-apple-darwin
          cargo build --release --target aarch64-apple-darwin

      - name: Put them in one binary and wrap it in a bundle
        run: |
          version="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          mkdir -p dist
          lipo -create -output dist/ntls \
            target/x86_64-apple-darwin/release/ntls \
            target/aarch64-apple-darwin/release/ntls
          lipo -info dist/ntls
          packaging/macos/bundle.sh dist/ntls dist "$version"
          rm dist/ntls
          # Zipped with ditto, which is what keeps the bundle's structure and
          # its ad-hoc signature intact.
          ditto -c -k --keepParent dist/ntls.app "dist/ntls-$version-macos-universal.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: ntls-macos-universal
          path: dist/*.zip
          if-no-files-found: error

  linux:
    name: Linux (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install the libraries GPUI links against
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libfontconfig-dev libwayland-dev libx11-xcb-dev \
            libxcb1-dev libxcb-dri3-dev libxkbcommon-x11-dev libssl-dev \
            libzstd-dev libvulkan-dev libgit2-dev make cmake clang mold

      - run: cargo build --release

      - name: Wrap it up with what a desktop needs to list it
        run: |
          version="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          name="ntls-$version-linux-${{ matrix.arch }}"
          mkdir -p "dist/$name"
          cp target/release/ntls "dist/$name/ntls"
          cp packaging/linux/ntls.desktop "dist/$name/ntls.desktop"
          cp packaging/linux/install.sh "dist/$name/install.sh"
          cp packaging/icon/png/ntls-512.png "dist/$name/ntls.png"
          cp README.md "dist/$name/README.md"
          cp -r docs "dist/$name/docs"
          tar -C dist -czf "dist/$name.tar.gz" "$name"

      - uses: actions/upload-artifact@v4
        with:
          name: ntls-linux-${{ matrix.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error

  windows:
    name: Windows (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-2022
            target: x86_64-pc-windows-msvc
            architectures: x64compatible
          - arch: arm64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            architectures: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      - run: cargo build --release --target ${{ matrix.target }}

      - name: The portable one, which is the executable and nothing else
        shell: bash
        run: |
          version="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          name="ntls-$version-windows-${{ matrix.arch }}-portable"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/ntls.exe" "dist/$name/ntls.exe"
          cp README.md "dist/$name/README.md"
          cd dist && 7z a "$name.zip" "$name" >/dev/null

      - name: The installer
        shell: bash
        run: |
          version="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          choco install innosetup --no-progress -y
          iscc.exe //DVersion="$version" \
                   //DBinary="$(pwd -W)/target/${{ matrix.target }}/release/ntls.exe" \
                   //DOutDir="$(pwd -W)/dist" \
                   //DArch="${{ matrix.arch }}" \
                   //DArchitectures="${{ matrix.architectures }}" \
                   packaging/windows/ntls.iss

      - uses: actions/upload-artifact@v4
        with:
          name: ntls-windows-${{ matrix.arch }}
          path: |
            dist/*.zip
            dist/*.exe
          if-no-files-found: error

  release:
    # Only a tag makes a release; every other build just leaves its artifacts
    # where the run can be downloaded from.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, macos, linux, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Hand them all to the release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
          draft: false
