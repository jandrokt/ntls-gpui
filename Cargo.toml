[package]
name = "ntls"
# Cargo insists on a semantic version. ntls does not have one: it has a build
# number, which CI stamps in through `NTLS_BUILD` and which is what the program
# calls itself everywhere. This field is here because the manifest format
# requires it, and nothing reads it.
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
description = "A desktop toolbox for the network questions you ask most often, and for getting things off it"
license = "Apache-2.0"

[[bin]]
name = "ntls"
path = "src/main.rs"

[dependencies]
gpui = "0.2"

anyhow = "1"
bytes = "1"
async-channel = "2"
flate2 = "1"
if-addrs = "0.15"
mac_address = "1.1"
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
socket2 = { version = "0.6", features = ["all"] }
unicode-segmentation = "1"

reqwest = { version = "0.13", default-features = false, features = [
  "default-tls",
  "json",
  "stream",
  "http2",
] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "io-util", "sync", "macros"] }
tokio-util = { version = "0.7", features = ["rt"] }
futures = "0.3"
scraper = "0.27"
url = "2"
percent-encoding = "2"
youtube_dl = { version = "0.10", features = ["tokio"] }
base64 = "0.22"

# The ICMP engine reads the TTL out of ancillary data and the port scanner
# raises the descriptor limit; both are Unix spellings of things Windows does
# differently or not at all.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Moving and sizing the window is the one thing gpui does not offer on Windows,
# and its own titlebar is hidden, so ntls asks the system directly. Both of
# these are already in the tree underneath gpui and at the versions it uses, so
# naming them here adds a dependency edge and nothing to compile: `windows` for
# the messages, and `raw-window-handle` for the one thing gpui does hand over,
# which is the window's handle.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }
raw-window-handle = "0.6"

# The Windows executable carries its own icon and version information.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
lto = "thin"
codegen-units = 1
