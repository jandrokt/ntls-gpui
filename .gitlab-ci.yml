# Builds every platform on every push, and publishes what it built.
#
# ntls counts builds, not versions. The number is the pipeline's own count:
# GitLab increments `CI_PIPELINE_IID` by one per pipeline, so it goes up on
# every commit, never repeats, and needs nothing committed back to the repo to
# keep it moving. It gets stamped into the binaries at compile time and names
# every artifact.
#
# Each build job uploads what it made to the generic package registry and
# writes down the URL. The release job collects those notes and hangs them off
# a release tagged `build-<n>`. Releases happen on the default branch only; a
# merge request builds and is checked, and leaves nothing behind.
#
# Runners: the Linux jobs want Docker runners, one of them arm64, and macOS and
# Windows want the SaaS runners of those names or your own tagged the same way.
# Delete the job for any platform you have no runner for. The release waits for
# every build job, and a job no runner can take never finishes.

stages: [test, build, release]

# One pipeline per change: for the merge request while there is one, for the
# branch otherwise. Without this a merge request gets two of everything.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

variables:
  CARGO_TERM_COLOR: always
  # Debug info makes these builds huge and nothing here reads it.
  CARGO_PROFILE_RELEASE_DEBUG: "false"
  CARGO_HOME: $CI_PROJECT_DIR/.cargo
  # The build number, and where the things it names are put.
  NTLS_BUILD: $CI_PIPELINE_IID
  PACKAGES: ${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/ntls

# What every Rust job wants back next time.
.cargo_cache: &cargo_cache
  key:
    files: [Cargo.lock]
    prefix: $CI_JOB_NAME_SLUG
  paths:
    - .cargo/registry/index
    - .cargo/registry/cache
    - .cargo/git/db
    - target

# The libraries GPUI links against, on Debian and Ubuntu.
.apt_deps: &apt_deps
  - apt-get update
  - >
    apt-get install -y --no-install-recommends
    libasound2-dev libfontconfig-dev libwayland-dev libx11-xcb-dev
    libxcb1-dev libxcb-dri3-dev libxkbcommon-x11-dev libssl-dev
    libzstd-dev libvulkan-dev libgit2-dev make cmake clang mold curl

# Hands one file to the package registry and writes down where it landed, so
# the release job can link to it without knowing what any platform produced.
.publish: &publish |
  publish() {
    file="$1"
    name="$(basename "$file")"
    curl --fail --silent --show-error --header "JOB-TOKEN: $CI_JOB_TOKEN" \
      --upload-file "$file" "$PACKAGES/$NTLS_BUILD/$name"
    mkdir -p links
    printf '%s|%s/%s/%s\n' "$name" "$PACKAGES" "$NTLS_BUILD" "$name" \
      >> "links/$CI_JOB_NAME_SLUG.txt"
    echo "published $name"
  }

# --- test --------------------------------------------------------------------

# Nothing in the tests is platform-specific, so once is enough.
test:
  stage: test
  image: rust:bookworm
  cache: *cargo_cache
  before_script: *apt_deps
  script:
    # Let this user open an unprivileged ICMP socket, so the ping test actually
    # runs here instead of skipping itself. Not every runner allows it, and the
    # test copes either way.
    - sysctl -w net.ipv4.ping_group_range="0 2147483647" || true
    # Nothing here touches the network beyond loopback.
    - cargo test

# --- build -------------------------------------------------------------------

linux:
  stage: build
  image: rust:bookworm
  cache: *cargo_cache
  parallel:
    matrix:
      - ARCH: x86_64
        RUNNER: saas-linux-medium-amd64
      - ARCH: aarch64
        RUNNER: saas-linux-medium-arm64
  tags: [$RUNNER]
  before_script: *apt_deps
  script:
    - *publish
    - cargo build --release
    - name="ntls-$NTLS_BUILD-linux-$ARCH"
    - mkdir -p "dist/$name"
    - cp target/release/ntls "dist/$name/ntls"
    - cp packaging/linux/ntls.desktop "dist/$name/ntls.desktop"
    - cp packaging/linux/install.sh "dist/$name/install.sh"
    - cp packaging/icon/png/ntls-512.png "dist/$name/ntls.png"
    - cp README.md "dist/$name/README.md"
    - cp -r docs "dist/$name/docs"
    - tar -C dist -czf "dist/$name.tar.gz" "$name"
    - publish "dist/$name.tar.gz"
  artifacts:
    name: ntls-$NTLS_BUILD-linux-$ARCH
    paths: [dist/*.tar.gz, links]
    expire_in: 30 days

macos:
  stage: build
  image: macos-14-xcode-15
  tags: [saas-macos-medium-m1]
  cache: *cargo_cache
  before_script:
    - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --profile minimal
    - source "$CARGO_HOME/env"
    - rustup target add x86_64-apple-darwin aarch64-apple-darwin
    # GPUI compiles shaders at build time. Usually already installed.
    - xcodebuild -downloadComponent MetalToolchain 2>/dev/null || echo "the Metal toolchain is already installed, or cannot be fetched here"
  script:
    - *publish
    - cargo build --release --target x86_64-apple-darwin
    - cargo build --release --target aarch64-apple-darwin
    - mkdir -p dist
    - lipo -create -output dist/ntls target/x86_64-apple-darwin/release/ntls target/aarch64-apple-darwin/release/ntls
    - lipo -info dist/ntls
    - bash packaging/macos/bundle.sh dist/ntls dist "$NTLS_BUILD"
    - rm dist/ntls
    # ditto, not zip: it keeps the bundle structure and the signature.
    - ditto -c -k --keepParent dist/ntls.app "dist/ntls-$NTLS_BUILD-macos-universal.zip"
    - publish "dist/ntls-$NTLS_BUILD-macos-universal.zip"
  artifacts:
    name: ntls-$NTLS_BUILD-macos-universal
    paths: [dist/*.zip, links]
    expire_in: 30 days

windows:
  stage: build
  tags: [saas-windows-medium-amd64]
  cache: *cargo_cache
  parallel:
    matrix:
      # There is no Windows-on-ARM runner to build on, so that one is
      # cross-compiled here. It needs the ARM64 MSVC build tools, which the
      # runner image carries.
      - ARCH: x64
        TARGET: x86_64-pc-windows-msvc
        ARCHITECTURES: x64compatible
      - ARCH: arm64
        TARGET: aarch64-pc-windows-msvc
        ARCHITECTURES: arm64
  before_script:
    - choco install rustup.install innosetup 7zip --no-progress -y
    - $env:PATH = "$env:CARGO_HOME\bin;$env:ProgramFiles\7-Zip;$env:PATH"
    - rustup toolchain install stable --profile minimal
    - rustup default stable
    - rustup target add $env:TARGET
  script:
    - cargo build --release --target $env:TARGET
    - $name = "ntls-$env:NTLS_BUILD-windows-$env:ARCH-portable"
    - New-Item -ItemType Directory -Force -Path "dist\$name" | Out-Null
    - Copy-Item "target\$env:TARGET\release\ntls.exe" "dist\$name\ntls.exe"
    - Copy-Item README.md "dist\$name\README.md"
    - 7z a "dist\$name.zip" "dist\$name" | Out-Null
    - $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
    - >
      & $iscc "/DBuild=$env:NTLS_BUILD"
      "/DBinary=$env:CI_PROJECT_DIR\target\$env:TARGET\release\ntls.exe"
      "/DOutDir=$env:CI_PROJECT_DIR\dist"
      "/DArch=$env:ARCH"
      "/DArchitectures=$env:ARCHITECTURES"
      packaging\windows\ntls.iss
    - if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    # The same errand as `publish` in the Unix jobs, in the shell this runner
    # speaks.
    - New-Item -ItemType Directory -Force -Path links | Out-Null
    - |
      Get-ChildItem dist -File | Where-Object { $_.Extension -in ".zip", ".exe" } | ForEach-Object {
        $url = "$env:PACKAGES/$env:NTLS_BUILD/$($_.Name)"
        curl.exe --fail --silent --show-error --header "JOB-TOKEN: $env:CI_JOB_TOKEN" --upload-file $_.FullName $url
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        Add-Content "links\windows-$env:ARCH.txt" "$($_.Name)|$url"
        Write-Host "published $($_.Name)"
      }
  artifacts:
    name: ntls-$NTLS_BUILD-windows-$ARCH
    paths: [dist/*.zip, dist/*.exe, links]
    expire_in: 30 days

# --- release -----------------------------------------------------------------

# Every commit on the default branch becomes a release, tagged by its build
# number. There is nothing to tag by hand: the number is the name of the thing.
#
# It takes no `needs`, so it waits for the whole build stage and collects every
# artifact from it, including the notes the build jobs left behind.
release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - |
      set -eu
      # Each build job wrote down what it uploaded. This turns the lot into the
      # arguments that hang them off the release.
      cat links/*.txt | sort -u > /tmp/assets
      test -s /tmp/assets
      set --
      while IFS='|' read -r name url; do
        [ -n "$name" ] || continue
        set -- "$@" --assets-link "{\"name\":\"$name\",\"url\":\"$url\",\"link_type\":\"package\"}"
      done < /tmp/assets
      release-cli create \
        --name "ntls build $NTLS_BUILD" \
        --tag-name "build-$NTLS_BUILD" \
        --ref "$CI_COMMIT_SHA" \
        --description "Build $NTLS_BUILD, from $CI_COMMIT_SHORT_SHA: $CI_COMMIT_TITLE" \
        "$@"
